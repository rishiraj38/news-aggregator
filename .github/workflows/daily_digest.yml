name: Daily AI Digest

on:
  schedule:
    - cron: "30 10 * * *" # Runs daily at 10:30 UTC (4:00 PM IST)
  workflow_dispatch: # Allows manual trigger from GitHub UI
  # Cron schedule: Runs daily (best effort by GitHub)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache scrape timestamp
        uses: actions/cache@v3
        with:
          path: .last_scrape
          key: scrape-cache-${{ github.run_id }}
          restore-keys: |
            scrape-cache-

      - name: Install uv (Fast Package Manager)
        uses: astral-sh/setup-uv@v1

      - name: Install Dependencies
        run: |
          uv pip install -r requirements.txt --system

      - name: Run Daily Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          WEBSHARE_USERNAME: ${{ secrets.WEBSHARE_USERNAME }}
          WEBSHARE_PASSWORD: ${{ secrets.WEBSHARE_PASSWORD }}
          # Instagram autopost (after successful digest). Toggle: Repository Variable ENABLE_INSTAGRAM_AUTOPOST, or Secret same name if you prefer.
          ENABLE_INSTAGRAM_AUTOPOST: ${{ vars.ENABLE_INSTAGRAM_AUTOPOST }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          META_GRAPH_MEDIA_BASE: ${{ secrets.META_GRAPH_MEDIA_BASE }}
          # Optional overrides (Secrets if sensitive; omit to use publisher defaults).
          META_PUBLIC_IMAGE_UPLOAD: ${{ vars.META_PUBLIC_IMAGE_UPLOAD }}
          META_PUBLIC_IMAGE_UPLOAD_ORDER: ${{ vars.META_PUBLIC_IMAGE_UPLOAD_ORDER }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          INSTAGRAM_SOURCE_IMAGE_URL: ${{ secrets.INSTAGRAM_SOURCE_IMAGE_URL }}

        run: |
          python -m app.daily_runner
