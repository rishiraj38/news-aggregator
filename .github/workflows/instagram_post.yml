# Build a multi-story carousel from the top-ranked digests and publish it (Instagram Graph API).
# Slides: cover + one per story + call-to-action. Set the repository variable
# INSTAGRAM_POST_FORMAT to `reel` for a 9:16 video instead, or `single` for the old card.
# Does not send digest email — keep this separate from `daily_digest.yml`.
#
# JPEG staging on runners: anonymous hosts (Catbox, 0x0.st, file.io, transfer.sh) are usually blocked or down.
# This workflow defaults META_PUBLIC_IMAGE_UPLOAD=cloudinary. Add Secrets:
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_UPLOAD_PRESET (Dashboard → Unsigned upload preset).
# Or set Secret INSTAGRAM_SOURCE_IMAGE_URL; or Repository variable META_PUBLIC_IMAGE_UPLOAD / IMGUR_* if you insist.

name: Instagram post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the post and print the caption, but publish nothing"
        type: boolean
        default: false
      test_video_upload:
        description: "Only check that a video can be staged publicly (no post)"
        type: boolean
        default: false
      format:
        description: "Post format (default = INSTAGRAM_POST_FORMAT variable)"
        type: choice
        options: [default, carousel, reel, single]
        default: default
  # Two posts per day:
  #   Morning: 04:30 UTC (10:00 AM IST)
  #   Evening: 11:00 UTC (4:30 PM IST) — ~30min after Daily AI Digest
  schedule:
    - cron: "30 4 * * *"
    - cron: "0 11 * * *"

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  instagram-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (Fast Package Manager)
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install -r requirements.txt --system

      # Reels are rendered with ffmpeg. The runner image ships it, but install on demand
      # so a runner image change can't silently break the post.
      - name: Ensure ffmpeg is available
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y ffmpeg

      - name: Publish Instagram card from latest digests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          WEBSHARE_USERNAME: ${{ secrets.WEBSHARE_USERNAME }}
          WEBSHARE_PASSWORD: ${{ secrets.WEBSHARE_PASSWORD }}
          DISABLE_SCRAPER_PROXY: ${{ vars.DISABLE_SCRAPER_PROXY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          META_GRAPH_MEDIA_BASE: ${{ secrets.META_GRAPH_MEDIA_BASE }}
          META_FACEBOOK_PAGE_ID: ${{ secrets.META_FACEBOOK_PAGE_ID }}
          META_SKIP_FACEBOOK_PAGE_STAGING: ${{ vars.META_SKIP_FACEBOOK_PAGE_STAGING }}
          # CI: anonymous mirrors are unreliable — use Cloudinary unsigned preset (Dashboard → Upload).
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          META_PUBLIC_IMAGE_UPLOAD: ${{ vars.META_PUBLIC_IMAGE_UPLOAD }}
          META_PUBLIC_IMAGE_UPLOAD_ORDER: ${{ vars.META_PUBLIC_IMAGE_UPLOAD_ORDER }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          INSTAGRAM_SOURCE_IMAGE_URL: ${{ secrets.INSTAGRAM_SOURCE_IMAGE_URL }}
          NEWS_GRAPHIC_TICKER: ${{ vars.NEWS_GRAPHIC_TICKER }}
          # Carousel: slide count plus the CTA slide's links
          INSTAGRAM_CAROUSEL_STORIES: ${{ vars.INSTAGRAM_CAROUSEL_STORIES || '5' }}
          # carousel (default) | reel | single
          INSTAGRAM_POST_FORMAT: ${{ vars.INSTAGRAM_POST_FORMAT || 'carousel' }}
          INSTAGRAM_SOURCE_VIDEO_URL: ${{ secrets.INSTAGRAM_SOURCE_VIDEO_URL }}
          HELIX_REEL_AUDIO: ${{ vars.HELIX_REEL_AUDIO }}
          HELIX_WEBSITE_URL: ${{ vars.HELIX_WEBSITE_URL }}
          HELIX_INSTAGRAM_HANDLE: ${{ vars.HELIX_INSTAGRAM_HANDLE }}
          HELIX_LOGO_PATH: ${{ vars.HELIX_LOGO_PATH }}
          INSTAGRAM_CURATOR_EMAIL: ${{ vars.INSTAGRAM_CURATOR_EMAIL }}
        run: |
          set -e
          EMAIL="${INSTAGRAM_CURATOR_EMAIL:-rishiraj438gt@gmail.com}"
          export META_PUBLIC_IMAGE_UPLOAD="${META_PUBLIC_IMAGE_UPLOAD:-cloudinary}"

          # inputs.* are empty on a schedule, so scheduled runs publish as before.
          if [ "${{ inputs.test_video_upload }}" = "true" ]; then
            echo "::notice::Checking the reel video staging chain only"
            python publish_instagram_card.py --test-video-upload
            exit 0
          fi

          MODE="--publish"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            MODE="--dry-run"
            echo "::notice::Dry run — building the post without publishing"
          fi

          FORMAT_FLAG=""
          case "${{ inputs.format }}" in
            reel)   FORMAT_FLAG="--reel" ;;
            single) FORMAT_FLAG="--single" ;;
          esac

          python publish_instagram_card.py $MODE $FORMAT_FLAG --email "$EMAIL"

      - name: Upload generated post for review
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: instagram-post-preview
          path: outputs/instagram/
          retention-days: 7
